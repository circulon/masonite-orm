[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masonite-framework-orm"
version = "3.1.0"
description = "The Official Masonite ORM"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "Joe Mancuso", email = "contact@masonite.dev" }]
maintainers = [{ name = "Eduardo Aguad", email = "contact@masonite.dev" }]
requires-python = ">=3.8"
keywords = ["Masonite", "masoniteorm", "Python", "ORM"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Masonite",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "inflection>=0.3,<0.6",
    "pendulum>=3.0,<4.0",
    "cleo>=2.1,<3",
]

[project.optional-dependencies]
test = ["coverage", "pytest", "faker"]
seeder = ["faker"]

[project.urls]
Homepage = "https://github.com/masonitedev/orm"
Documentation = "https://docs.masonite.dev"

[project.scripts]
masonite-orm = "masoniteorm.commands.Entry:application.run"
masoniteorm = "masoniteorm.commands.Entry:application.run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
env = [
    "D:DB_CONFIG_PATH=tests/integrations/config/database",
]

[tool.ruff]
target-version = "py38"
line-length = 79
exclude = ["build", "conda", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # long lines are dominated by SQL strings; formatter handles the rest
    "E402", # module-level import not at top of file
    "E731", # do not assign a lambda expression
    "E712", # comparison to True/False (used to build query expressions)
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
